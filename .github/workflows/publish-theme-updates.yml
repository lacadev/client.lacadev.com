name: Publish Theme Updates

on:
  push:
    branches: [main, master]

jobs:
  publish:
    name: Build, package & publish theme update packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Build parent theme (lacadev-client)
        working-directory: app/public/wp-content/themes/lacadev-client
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Read theme version
        id: versions
        working-directory: app/public/wp-content/themes
        run: |
          PARENT_VERSION=$(grep -m1 '^ \* Version:' lacadev-client/theme/style.css | sed -E 's/^ \* Version:[[:space:]]*//')
          echo "parent=$PARENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Chỉ đóng gói & publish theme CHA (lacadev-client). Theme con
      # (lacadev-client-child) KHÔNG được tự động cập nhật xuống site khách.
      - name: Package parent theme zip
        working-directory: app/public/wp-content/themes
        run: |
          mkdir -p "$GITHUB_WORKSPACE/publish/private"
          mkdir -p "$GITHUB_WORKSPACE/publish-legacy"

          # Tạo file .htaccess bảo vệ thư mục private không cho truy cập web trực tiếp
          cat > "$GITHUB_WORKSPACE/publish/private/.htaccess" << 'EOF'
          # Deny direct access to private theme packages
          <IfModule mod_authz_core.c>
              Require all denied
          </IfModule>
          <IfModule !mod_authz_core.c>
              Deny from all
          </IfModule>
          EOF

          # Đóng gói zip an toàn vào thư mục private/
          zip -r "$GITHUB_WORKSPACE/publish/private/lacadev-client.zip" lacadev-client \
            -x "lacadev-client/.git/*" \
            -x "lacadev-client/.github/*" \
            -x "lacadev-client/node_modules/*" \
            -x "lacadev-client/*.md"

          # TODO: XOÁ BƯỚC NÀY sau khi mọi client lên >= 3.2
          # Giữ 1 bản zip công khai cũ cho các client cũ chưa biết ký HMAC tải trực tiếp
          cp "$GITHUB_WORKSPACE/publish/private/lacadev-client.zip" "$GITHUB_WORKSPACE/publish/lacadev-client.zip"
          cp "$GITHUB_WORKSPACE/publish/private/lacadev-client.zip" "$GITHUB_WORKSPACE/publish-legacy/lacadev-client.zip"

      - name: Generate update JSON files
        env:
          PARENT_VERSION: ${{ steps.versions.outputs.parent }}
          BUILD_DATE: ${{ steps.versions.outputs.date }}
        run: |
          php -r '
            $version   = getenv("PARENT_VERSION") ?: "3.2";
            $buildDate = getenv("BUILD_DATE") ?: date("Y-m-d");
            $changelogPath = "app/public/wp-content/themes/lacadev-client/CHANGELOG.md";
            $changelog = "";
            if (file_exists($changelogPath)) {
                $content = file_get_contents($changelogPath);
                if (preg_match("/## " . preg_quote($version, "/") . ".*?\n(.*?)(?=\n## |\Z)/s", $content, $m)) {
                    $changelog = trim($m[1]);
                }
            }

            // 1. JSON chính thức đặt tại lacadev.com (download_url trỏ endpoint có xác thực)
            $mainJson = [
                "name"         => "La Cà Dev - Client",
                "version"      => $version,
                "download_url" => "https://lacadev.com/wp-json/laca/v1/theme-package/lacadev-client",
                "details_url"  => "https://lacadev.com",
                "requires"     => "6.0",
                "requires_php" => "8.0",
                "last_updated" => $buildDate,
                "description"  => "Theme cha La Cà Dev - Client — cập nhật tự động an toàn từ lacadev.com",
                "changelog"    => $changelog,
            ];
            file_put_contents(
                getenv("GITHUB_WORKSPACE") . "/publish/lacadev-client.json",
                json_encode($mainJson, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES)
            );

            // 2. JSON mồi cho client cũ đặt tại clients.lacadev.com (download_url trỏ zip công khai)
            $legacyJson = [
                "name"         => "La Cà Dev - Client",
                "version"      => $version,
                "download_url" => "https://lacadev.com/theme-updates/lacadev-client.zip",
                "details_url"  => "https://lacadev.com",
                "requires"     => "6.0",
                "requires_php" => "8.0",
                "last_updated" => $buildDate,
                "description"  => "Theme cha La Cà Dev - Client — cập nhật tự động từ lacadev.com",
                "changelog"    => $changelog,
            ];
            file_put_contents(
                getenv("GITHUB_WORKSPACE") . "/publish-legacy/lacadev-client.json",
                json_encode($legacyJson, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES)
            );
          '

      - name: Upload theme-updates package (lacadev.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/theme-updates/
          local-dir: publish/

      # -----------------------------------------------------------------------
      # TODO: XOÁ BƯỚC NÀY sau khi mọi client đã nâng cấp lên >= 3.2
      # Bước mồi cho client cũ đang đọc clients.lacadev.com/theme-updates/lacadev-client.json
      # -----------------------------------------------------------------------
      - name: Bait step for legacy clients (clients.lacadev.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /clients.lacadev.com/theme-updates/
          local-dir: publish-legacy/
