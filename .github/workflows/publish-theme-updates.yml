name: Publish Theme Updates

on:
  push:
    tags:
      - 'lacadev-client-v*'
  workflow_dispatch:

concurrency:
  group: publish-theme-updates
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign & publish parent theme update package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: sodium, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Create child config.json from dist
        working-directory: app/public/wp-content/themes/lacadev-client-child
        run: cp config.json.dist config.json

      - name: Install child Node dependencies
        working-directory: app/public/wp-content/themes/lacadev-client-child
        run: yarn install --frozen-lockfile

      - name: Verify version matches git tag & signing secret exists
        id: versions
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          LACA_RELEASE_SIGNING_KEY: ${{ secrets.LACA_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$LACA_RELEASE_SIGNING_KEY" ]; then
            echo "::error::Missing required GitHub secret LACA_RELEASE_SIGNING_KEY"
            exit 1
          fi

          STYLE_VER="$(grep -m1 '^ \* Version:' app/public/wp-content/themes/lacadev-client/theme/style.css | sed -E 's/^ \* Version:[[:space:]]*//' | tr -d '\r')"
          if [ -z "$STYLE_VER" ]; then
            echo "::error::Could not read Version from theme/style.css"
            exit 1
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            EXPECTED_TAG="lacadev-client-v${STYLE_VER}"
            if [ "$REF_NAME" != "$EXPECTED_TAG" ]; then
              echo "::error::Git tag ($REF_NAME) does not match theme/style.css Version ($STYLE_VER; expected $EXPECTED_TAG)"
              exit 1
            fi
          fi

          echo "version=$STYLE_VER" >> "$GITHUB_OUTPUT"

      - name: Build & sign deterministic release package
        env:
          LACA_RELEASE_SIGNING_KEY: ${{ secrets.LACA_RELEASE_SIGNING_KEY }}
          PARENT_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          bash app/public/wp-content/themes/lacadev-client/tools/release/build-package.sh \
            --version "$PARENT_VERSION" \
            --download-url "https://lacadev.com/wp-json/laca/v1/theme-package/lacadev-client" \
            --out "$GITHUB_WORKSPACE/publish-out"

      - name: Assemble publish directory (private package + signed manifest only)
        env:
          PARENT_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/publish/private"

          cat > "$GITHUB_WORKSPACE/publish/private/.htaccess" << 'EOF'
          # Deny direct access to private theme packages
          <IfModule mod_authz_core.c>
              Require all denied
          </IfModule>
          <IfModule !mod_authz_core.c>
              Deny from all
          </IfModule>
          EOF

          printf '<?php // Silence is golden.\n' > "$GITHUB_WORKSPACE/publish/private/index.php"

          cp "$GITHUB_WORKSPACE/publish-out/lacadev-client-${PARENT_VERSION}.zip" "$GITHUB_WORKSPACE/publish/private/lacadev-client.zip"
          cp "$GITHUB_WORKSPACE/publish-out/lacadev-client-${PARENT_VERSION}.json" "$GITHUB_WORKSPACE/publish/lacadev-client.json"

      - name: Upload theme-updates package (lacadev.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/theme-updates/
          local-dir: publish/
